name: Deploy to GitHub Pages

on:
  push:
    branches: [source]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gates, not decoration: these run before the build, so a lint error or a
      # failing test stops the deploy instead of shipping. Nothing ran here
      # before, which is how a vitest setup file missing from every clone went
      # unnoticed — the suite had been failing on checkout, silently.
      - run: npm run lint

      - run: npm run test:run

      - run: GH_PAGES=1 npx next build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # Must stay false so gh-pages mirrors out/ exactly. With keep_files
          # on, anything ever published stays served forever: deleting the old
          # /prototype site and the public/projects screenshots from source
          # left both still reachable in production.
          keep_files: false
